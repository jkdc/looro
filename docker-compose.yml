# Coolify deployment (same pattern as OpenTerminal): root-level compose,
# domains are wired in the Coolify UI. Differences imposed by this backend:
# PostgreSQL is required, and the accounts login needs trusted-proxy headers
# that Coolify's Traefik cannot inject, so an `edge` Caddy sidecar provides
# them. Point the Coolify domain at service `edge`, port 8081.
services:
  database:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a unique database password in Coolify}
    volumes:
      - palique-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: services/api
      dockerfile: Dockerfile
    command: ["node", "dist/src/migrate.js"]
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?Set the public origin in Coolify (https://your-domain)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ACCOUNTS_ENABLED=${ACCOUNTS_ENABLED:-}
      - ACCOUNTS_HMAC_KEY=${ACCOUNTS_HMAC_KEY:-}
      - ACCOUNTS_PROXY_TOKEN=${ACCOUNTS_PROXY_TOKEN:-}
      - GOOGLE_ANDROID_SERVER_CLIENT_ID=${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_IDS=${GOOGLE_ANDROID_CLIENT_IDS:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      - STRIPE_TEST_WEBHOOK_SECRET=${STRIPE_TEST_WEBHOOK_SECRET:-}
      - ADMIN_HMAC_KEY=${ADMIN_HMAC_KEY:-}
      - ADMIN_PROXY_TOKEN=${ADMIN_PROXY_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LEVELTEST_GENERATE_ENABLED=${LEVELTEST_GENERATE_ENABLED:-false}
      - LEVELTEST_LLM_PROVIDER=${LEVELTEST_LLM_PROVIDER:-}
      - LEVELTEST_LLM_URL=${LEVELTEST_LLM_URL:-}
      - LEVELTEST_LLM_MODEL=${LEVELTEST_LLM_MODEL:-}
      - LEVELTEST_LLM_API_KEY=${LEVELTEST_LLM_API_KEY:-}
      - LEVELTEST_LLM_MASTER_KEY=${LEVELTEST_LLM_MASTER_KEY:-}
      # Observability stack is not part of the Coolify deployment.
      - OTEL_ENABLED=false
      - OTEL_SERVICE_NAME=palique-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Coolify's Traefik cannot inject custom request headers, so this Caddy
  # sidecar is the edge for the Coolify domain (login trusted-proxy headers).
  edge:
    image: caddy:2-alpine
    environment:
      - ACCOUNTS_PROXY_TOKEN=${ACCOUNTS_PROXY_TOKEN:-}
    volumes:
      - ./services/api/Caddyfile.coolify:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  palique-postgres:
