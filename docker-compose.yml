# Full-stack Coolify deployment: same containers as the local stack
# (database + migrations + API + Caddy edge with admin panel + full
# observability). Coolify's Traefik owns ports 80/443 and terminates TLS,
# so this compose publishes no host ports: wire the Coolify domains at
# service `caddy`, port 80:
#   API_DOMAIN   -> caddy:80
#   ADMIN_DOMAIN -> caddy:80 (same container, routed by Host)
# Observability UIs stay bound to 127.0.0.1 only (SSH tunnel to reach them).
services:
  database:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - palique-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: services/api
      dockerfile: Dockerfile
    command: ["node", "dist/src/migrate.js"]
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
      - PUBLIC_ORIGIN=https://${API_DOMAIN:?Set the API domain}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ACCOUNTS_ENABLED=${ACCOUNTS_ENABLED:-}
      - ACCOUNTS_HMAC_KEY=${ACCOUNTS_HMAC_KEY:-}
      - ACCOUNTS_PROXY_TOKEN=${ACCOUNTS_PROXY_TOKEN:-}
      - GOOGLE_ANDROID_SERVER_CLIENT_ID=${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_IDS=${GOOGLE_ANDROID_CLIENT_IDS:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      - STRIPE_TEST_WEBHOOK_SECRET=${STRIPE_TEST_WEBHOOK_SECRET:-}
      - ADMIN_HMAC_KEY=${ADMIN_HMAC_KEY:-}
      - ADMIN_PROXY_TOKEN=${ADMIN_PROXY_TOKEN:-}
      - HOSTED_VOICE_EXPERIMENTAL=${HOSTED_VOICE_EXPERIMENTAL:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LEVELTEST_GENERATE_ENABLED=${LEVELTEST_GENERATE_ENABLED:-false}
      - LEVELTEST_GENERATE_LANGS=${LEVELTEST_GENERATE_LANGS:-en,es}
      - LEVELTEST_GENERATE_LEVELS=${LEVELTEST_GENERATE_LEVELS:-A1,A2,B1}
      - LEVELTEST_LLM_PROVIDER=${LEVELTEST_LLM_PROVIDER:-}
      - LEVELTEST_LLM_URL=${LEVELTEST_LLM_URL:-}
      - LEVELTEST_LLM_MODEL=${LEVELTEST_LLM_MODEL:-}
      - LEVELTEST_LLM_API_KEY=${LEVELTEST_LLM_API_KEY:-}
      - LEVELTEST_LLM_MASTER_KEY=${LEVELTEST_LLM_MASTER_KEY:-}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=palique-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Edge behind Coolify's Traefik: routes by Host to the API and serves the
  # admin panel. Both Coolify domains point at this service, port 80.
  caddy:
    image: caddy:2-alpine
    environment:
      - API_DOMAIN=${API_DOMAIN:?Set the API domain}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:?Set the admin panel domain}
      - ADMIN_PROXY_TOKEN=${ADMIN_PROXY_TOKEN:-}
    volumes:
      - ./services/api/admin-ui:/srv/admin-ui:ro
      - palique-caddy-data:/data
      - palique-caddy-config:/config
    configs:
      - source: caddy-config
        target: /etc/caddy/Caddyfile
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel-config
        target: /etc/otelcol-contrib/config.yaml
    expose:
      - "4318"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - palique-tempo:/tmp/tempo
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    expose:
      - "3200"
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  tempo-init:
    image: alpine:3.20
    command: ["chown", "-R", "10001:10001", "/tmp/tempo"]
    volumes:
      - palique-tempo:/tmp/tempo
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - palique-prometheus:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alerts
        target: /etc/prometheus/alerts.yml
    depends_on:
      - otel-collector
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    depends_on:
      - webhook-logger
    restart: unless-stopped

  webhook-logger:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
                length = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(length).decode("utf-8", "replace")
                try:
                    pretty = json.dumps(json.loads(body), ensure_ascii=False, sort_keys=True)
                except ValueError:
                    pretty = body
                print(f"ALERT POST {self.path}: {pretty}", flush=True)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"ok":true}')

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 5001), Handler).serve_forever()
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.8
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-palique-local}
    volumes:
      - palique-grafana:/var/lib/grafana
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/datasource.yaml
      - source: grafana-dashboards-provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana-dashboard-palique
        target: /etc/grafana/dashboards/palique-overview.json
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  palique-postgres:
  palique-caddy-data:
  palique-caddy-config:
  palique-tempo:
  palique-prometheus:
  palique-grafana:

# File configs travel inside the Docker config store instead of host bind
# mounts: Coolify artifacts can leave stale directories where a file is
# expected, which breaks file mounts (dir-onto-file) at container start.
configs:
  caddy-config:
    file: ./services/api/Caddyfile.coolify-full
  otel-config:
    file: ./services/api/telemetry/otel-collector-config.yaml
  tempo-config:
    file: ./services/api/telemetry/tempo.yaml
  prometheus-config:
    file: ./services/api/telemetry/prometheus.yml
  prometheus-alerts:
    file: ./services/api/telemetry/alerts.yml
  alertmanager-config:
    file: ./services/api/telemetry/alertmanager.yml
  grafana-datasource:
    file: ./services/api/telemetry/grafana/provisioning/datasources/datasource.yaml
  grafana-dashboards-provider:
    file: ./services/api/telemetry/grafana/provisioning/dashboards/dashboards.yaml
  grafana-dashboard-palique:
    file: ./services/api/telemetry/grafana/dashboards/palique-overview.json
