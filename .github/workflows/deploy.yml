name: Deploy API to VPS

# Deploys the backend stack (services/api) to the Hostinger VPS on every push
# to main that touches the server, shared content or this workflow. The VPS
# pulls the same private repo and rebuilds its Docker Compose stack; see
# docs/deployment-hostinger.md.

on:
  # Auto-deploy is handled by the Coolify webhook on push (see
  # docs/deployment-coolify.md). This workflow stays as a manual fallback for
  # a dedicated-server setup (docs/deployment-hostinger.md).
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$VPS_SSH_KEY" > key
          # accept-new records the host key on first contact and pins it after;
          # for stricter pinning set VPS_KNOWN_HOSTS to the output of
          # `ssh-keyscan -p <port> <host>` and echo it into known_hosts instead.
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            install -m 600 /dev/null known_hosts
            printf '%s\n' "$VPS_KNOWN_HOSTS" > known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > known_hosts 2>/dev/null
            chmod 600 known_hosts
          fi
          ssh_opts=(-i key -p "$VPS_PORT" -o UserKnownHostsFile=known_hosts \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o BatchMode=yes -o ServerAliveInterval=30)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -eu; cd /srv/palique && \
             REPO_URL=git@github.com:jkdc/palique.git \
             BRANCH=main DEPLOY_DIR=/srv/palique \
             bash services/api/operations/deploy.sh"
          rm -f key
