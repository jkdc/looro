org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Level-tests generation grew the generated-data sources; give the Kotlin daemon headroom.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# Generated level-test data is large: keep compilation inside the Gradle daemon.
kotlin.compiler.execution.strategy=in-process
