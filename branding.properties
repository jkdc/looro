# Canonical brand identity — the single place where the product brand lives.
#
# To rename the app:
#   1. edit the values below
#   2. run: python3 scripts/apply_branding.py --from-brand <Old> --to-brand <New>
#   3. regenerate the Xcode project: python3 scripts/generate_project.py
#   4. run the suites (Android JVM tests + lint, backend docker suite,
#      scripts/check_cross_platform.py) — see openspec/changes/brand-constants
#
# Files, classes, packages, resources, targets and backend identifiers are
# generic on purpose; they never need to change on a rename.
#
# TODO(rebrand): replace the .example placeholders (support email/URL) with
# the publisher's real domain before any store submission, and register the
# bundle/applicationId below in App Store Connect / Play Console.

APP_NAME=Palique

# Reverse-domain base owned by the publisher (stable across renames).
REVERSE_DOMAIN_BASE=com.jkdc

IOS_BUNDLE_ID=com.jkdc.palique
ANDROID_APPLICATION_ID=com.jkdc.palique.android

# Code identity, deliberately brand-free so renames never touch sources.
ANDROID_NAMESPACE=com.jkdc.app

SUPPORT_EMAIL=support@palique.example
SUPPORT_URL=https://palique.example/support
