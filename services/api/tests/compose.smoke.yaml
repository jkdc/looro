# Isolated local smoke stack. No production environment or public listener.
# Telemetry is intentionally absent here: the API is a no-op exporter unless
# OTEL_ENABLED=true, and no OTEL_* env is set in this stack.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app_container_test
      POSTGRES_USER: app_test
      POSTGRES_PASSWORD: isolated-smoke-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_test -d app_container_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - smoke_data:/var/lib/postgresql/data
  migrate:
    image: app-server-smoke:local
    build: ..
    environment:
      DATABASE_URL: postgresql://app_test:isolated-smoke-test-only@database:5432/app_container_test
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
  api:
    image: app-server-smoke:local
    build: ..
    environment:
      DATABASE_URL: postgresql://app_test:isolated-smoke-test-only@database:5432/app_container_test
      PUBLIC_ORIGIN: http://localhost:8080
      ADMIN_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_PROXY_TOKEN: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ADMIN_PUBLIC_ORIGIN: http://localhost:8081
      ADMIN_ALLOW_LOCAL_LOOPBACK: "true"
    ports: ["127.0.0.1::8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
  tests:
    image: app-server-smoke:local
    volumes:
      - ../../../shared:/shared:ro
      - ../../../apps:/apps:ro
    environment:
      TEST_DATABASE_URL: postgresql://app_test:isolated-smoke-test-only@database:5432/app_container_test
      SMOKE_API_BASE_URL: http://api:8080
      SMOKE_ADMIN_PROXY_TOKEN: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    command: ["sh", "-c", "node --test --test-concurrency=1 dist/tests/*.test.js"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  smoke_data:
