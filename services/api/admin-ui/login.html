<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The login document is the only one allowed to talk to the identity provider. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; frame-src https://accounts.google.com">
<title>Palique · Acceso administración</title>
<link rel="stylesheet" href="/vendor/tabler.min.css?v=4">
<link rel="stylesheet" href="/vendor/icons/tabler-icons.min.css?v=4">
</head>
<body class="border-top-wide border-primary d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="avatar avatar-lg bg-primary-lt text-primary mb-2"><i class="ti ti-player-play fs-1"></i></span>
      <h1 class="login-brand">Palique<span class="text-secondary"> · Admin</span></h1>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-1">Inicio de sesión de operador</h2>
        <div class="text-secondary text-center mb-4">Acceso reservado; cada entrada queda registrada.</div>
        <div id="google-flow">
          <a href="#" class="btn btn-white w-100" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" class="icon"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
            Continuar con Google
          </a>
          <div class="hr-text" id="or-divider">o</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Sesión existente (token bearer)</label>
          <input type="text" class="form-control font-monospace" id="bearer" placeholder="43 caracteres" maxlength="128" autocomplete="off">
          <div class="form-hint">Convierte un token emitido previamente en cookie de sesión. Útil para acceso no interactivo.</div>
        </div>
        <button class="btn btn-primary w-100" id="bearer-btn"><i class="ti ti-key me-1"></i>Crear sesión</button>
        <div id="error" class="text-danger mt-3"></div>
      </div>
    </div>
  </div>
</div>
<script src="/login.js?v=4"></script>
</body>
</html>
