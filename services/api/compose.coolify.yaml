# Docker Compose variant for Coolify (or any external-proxy platform).
#
# Coolify's own Traefik terminates TLS and routes the domain, so this file
# deliberately drops the caddy and observability services from compose.yaml
# and publishes no host ports (Coolify exposes the `api` service itself).
#
# Deploy as a Coolify "Docker Compose" resource from the private repo, with:
#   - Dockerfile / compose file: services/api/compose.coolify.yaml
#   - Env vars (Coolify UI, or services/api/.env): see docs/deployment-coolify.md
#   - Domain in Coolify pointing at service `api`, port 8080
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public origin (https://your-domain)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Accounts admission: Traefik/Coolify injects the trusted-proxy headers
      # (see docs/deployment-coolify.md for the middleware config).
      ACCOUNTS_ENABLED: ${ACCOUNTS_ENABLED:-}
      ACCOUNTS_HMAC_KEY: ${ACCOUNTS_HMAC_KEY:-}
      ACCOUNTS_PROXY_TOKEN: ${ACCOUNTS_PROXY_TOKEN:-}
      GOOGLE_ANDROID_SERVER_CLIENT_ID: ${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      ADMIN_HMAC_KEY: ${ADMIN_HMAC_KEY:-}
      ADMIN_PROXY_TOKEN: ${ADMIN_PROXY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LEVELTEST_LLM_MASTER_KEY: ${LEVELTEST_LLM_MASTER_KEY:-}
      LEVELTEST_GENERATE_ENABLED: ${LEVELTEST_GENERATE_ENABLED:-false}
      LEVELTEST_LLM_PROVIDER: ${LEVELTEST_LLM_PROVIDER:-}
      LEVELTEST_LLM_URL: ${LEVELTEST_LLM_URL:-}
      LEVELTEST_LLM_MODEL: ${LEVELTEST_LLM_MODEL:-}
      LEVELTEST_LLM_API_KEY: ${LEVELTEST_LLM_API_KEY:-}
      # Observability is not part of the Coolify stack; keep the API healthy
      # with the exporter disabled (compose.yaml enables it unconditionally).
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: palique-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # Coolify's Traefik cannot inject custom request headers, so this Caddy
  # sidecar is the edge for the Coolify domain: point the domain in the
  # Coolify UI at service `edge`, port 8081.
  edge:
    image: caddy:2-alpine
    environment:
      ACCOUNTS_PROXY_TOKEN: ${ACCOUNTS_PROXY_TOKEN:-}
    volumes:
      - ./Caddyfile.coolify:/etc/caddy/Caddyfile:ro
    depends_on: [api]
    expose:
      - "8081"
    restart: unless-stopped
volumes:
  postgres_data:
