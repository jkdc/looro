services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app
      PUBLIC_ORIGIN: https://${API_DOMAIN:?Set the API domain}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Accounts admission (trusted-proxy caps for sign-in and account routes).
      ACCOUNTS_HMAC_KEY: ${ACCOUNTS_HMAC_KEY:-}
      ACCOUNTS_PROXY_TOKEN: ${ACCOUNTS_PROXY_TOKEN:-}
      # Token billing proxy (token-billing F2): disabled unless a provider is set.
      PROXY_PROVIDER_URL: ${PROXY_PROVIDER_URL:-}
      PROXY_PROVIDER_KEY: ${PROXY_PROVIDER_KEY:-}
      PROXY_MAX_TOKENS: ${PROXY_MAX_TOKENS:-}
      PROXY_MAX_CONCURRENT: ${PROXY_MAX_CONCURRENT:-}
      GOOGLE_ANDROID_SERVER_CLIENT_ID: ${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_PRICE_10_USD: ${STRIPE_TEST_PRICE_10_USD:-}
      STRIPE_TEST_PRICE_25_USD: ${STRIPE_TEST_PRICE_25_USD:-}
      STRIPE_TEST_PAYMENT_FEE_10_MINOR: ${STRIPE_TEST_PAYMENT_FEE_10_MINOR:-}
      STRIPE_TEST_PAYMENT_FEE_25_MINOR: ${STRIPE_TEST_PAYMENT_FEE_25_MINOR:-}
      # Admin panel (docs/admin-panel.md): local operator credentials only;
      # disabled unless the HMAC/proxy secrets and origin are supplied.
      ADMIN_HMAC_KEY: ${ADMIN_HMAC_KEY:-}
      ADMIN_PROXY_TOKEN: ${ADMIN_PROXY_TOKEN:-}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-}
      ADMIN_ALLOW_LOCAL_LOOPBACK: ${ADMIN_ALLOW_LOCAL_LOOPBACK:-false}
      # Hosted voice passthrough (experimental; docs/hosted-helpers.md).
      HOSTED_VOICE_EXPERIMENTAL: ${HOSTED_VOICE_EXPERIMENTAL:-false}
      HOSTED_VOICE_ACCESS: ${HOSTED_VOICE_ACCESS:-restricted-test}
      HOSTED_VOICE_BILLING_UNIT: ${HOSTED_VOICE_BILLING_UNIT:-nanoUSD}
      HOSTED_VOICE_ACCOUNT_ALLOWLIST: ${HOSTED_VOICE_ACCOUNT_ALLOWLIST:-}
      HOSTED_VOICE_LIFETIME_CAP_NANO: ${HOSTED_VOICE_LIFETIME_CAP_NANO:-0}
      HOSTED_HELPERS_EXPERIMENTAL: ${HOSTED_HELPERS_EXPERIMENTAL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Weekly level-test generation (disabled unless explicitly enabled).
      LEVELTEST_GENERATE_ENABLED: ${LEVELTEST_GENERATE_ENABLED:-false}
      LEVELTEST_GENERATE_HOUR: ${LEVELTEST_GENERATE_HOUR:-4}
      LEVELTEST_GENERATE_DAY: ${LEVELTEST_GENERATE_DAY:-7}
      LEVELTEST_GENERATE_LANGS: ${LEVELTEST_GENERATE_LANGS:-en,es}
      LEVELTEST_GENERATE_LEVELS: ${LEVELTEST_GENERATE_LEVELS:-A1,A2,B1}
      LEVELTEST_GENERATE_TIMEOUT_MS: ${LEVELTEST_GENERATE_TIMEOUT_MS:-900000}
      LEVELTEST_LLM_PROVIDER: ${LEVELTEST_LLM_PROVIDER:-}
      LEVELTEST_LLM_URL: ${LEVELTEST_LLM_URL:-}
      LEVELTEST_LLM_MODEL: ${LEVELTEST_LLM_MODEL:-}
      LEVELTEST_LLM_API_KEY: ${LEVELTEST_LLM_API_KEY:-}
      LEVELTEST_LLM_MASTER_KEY: ${LEVELTEST_LLM_MASTER_KEY:-}
      LEVELTEST_VARIANTS: ${LEVELTEST_VARIANTS:-3}
      LEVELTEST_PUBLISH_MODE: ${LEVELTEST_PUBLISH_MODE:-review}
      LEVELTEST_VERIFY: ${LEVELTEST_VERIFY:-flag}
      # Observability: disabled unless OTEL_ENABLED=true. The collector being
      # down never takes the API down; export is best-effort and buffered.
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: palique-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # ---- Observability stack -------------------------------------------------
  # Same topology as the reference project: OTLP -> collector -> Prometheus
  # (metrics/alerts) and Tempo (traces), with Grafana provisioning dashboards.
  # Every port is published on 127.0.0.1 only: in production only Caddy owns
  # 80/443, and these UIs are reached through an SSH tunnel.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [tempo]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped
  # Tempo runs as uid 10001 and a fresh named volume is root-owned, so its
  # block store cannot mkdir. The reference deployment chowned the volume once
  # by hand; an init container makes that reproducible on every fresh checkout.
  tempo-init:
    image: alpine:3.20
    command: ["chown", "-R", "10001:10001", "/tmp/tempo"]
    volumes:
      - tempo_data:/tmp/tempo
    restart: "no"
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./telemetry/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [otel-collector, alertmanager]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./telemetry/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on: [webhook-logger]
    restart: unless-stopped
  # Local sink for Alertmanager: every alert payload is logged to stdout
  # (docker compose logs webhook-logger) so the route always has a verifiable
  # destination. External delivery (Slack/PagerDuty) stays documented evolution.
  webhook-logger:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
                length = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(length).decode("utf-8", "replace")
                try:
                    pretty = json.dumps(json.loads(body), ensure_ascii=False, sort_keys=True)
                except ValueError:
                    pretty = body
                print(f"ALERT POST {self.path}: {pretty}", flush=True)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"ok":true}')

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 5001), Handler).serve_forever()
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.4.8
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-palique-local}
    volumes:
      - ./telemetry/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./telemetry/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./telemetry/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3003:3000"
    depends_on: [tempo, prometheus]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
      # Without the panel's DNS record the site binds admin.localhost with an internal cert,
      # so the deployment still boots; set ADMIN_DOMAIN to enable the panel for real.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      # Trusted-proxy secret for /v1/admin/* (header_up); empty keeps the API failing closed.
      ADMIN_PROXY_TOKEN: ${ADMIN_PROXY_TOKEN:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-ui:/srv/admin-ui:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  tempo_data:
  prometheus_data:
  grafana_data:
