server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          # Without an explicit endpoint Tempo binds localhost inside its own
          # container and the collector gets "connection refused" exporting spans.
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
